{% extends "base/base.html" %}
{% block title %}Set New Password — Fitness Planner{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Set a new password</h1>
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Set password</button>
        </form>
    {% else %}
        <p class="error">This reset link has expired or is invalid. Please <a href="{% url 'accounts:password_reset' %}">request a new one</a>.</p>
    {% endif %}
</div>
{% endblock %}
