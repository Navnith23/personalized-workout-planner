{% extends "base/base.html" %}
{% block title %}Reset Password — Kinetic{% endblock %}
{% block content %}
<div class="py-10 flex justify-center">
    <div class="auth-card w-full max-w-md">
        <div class="mb-6 text-center space-y-1">
            <div class="w-10 h-10 rounded-xl bg-surface-slate border border-border-active text-electric-lime flex items-center justify-center mx-auto mb-3">
                <span class="material-symbols-outlined text-2xl">key</span>
            </div>
            <h1 class="font-display text-2xl font-bold uppercase tracking-tight text-text-primary">Reset Password</h1>
            <p class="text-xs text-text-secondary">Enter your email address and we'll send recovery credentials.</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div class="space-y-4 text-sm">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-primary w-full py-3 mt-4">Send Reset Link</button>
        </form>

        <div class="mt-6 pt-6 border-t border-border-subtle text-center text-xs">
            <p><a href="{% url 'accounts:login' %}" class="text-text-muted hover:text-text-primary">Back to log in</a></p>
        </div>
    </div>
</div>
{% endblock %}
